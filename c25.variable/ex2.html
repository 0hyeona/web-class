<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제2-BMI</title>
    <link rel="stylesheet" href="./ex2.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <script>
                let name = prompt('이름을 입력해주세요.');
                let weight = Number(prompt('몸무게를 입력해주세요.'));
                let height = Number(prompt('키를 입력해주세요.'));
                let heightCm = height/100;
                let bmi = weight / Math.pow(heightCm,2);

                document.write(`
                    <h1>나의 체질량 지수(BMI)</h1>
                    <p>체질량지수는 자신의 몸무게(kg)를 키의 제곱(m)으로 나눈 값입니다. 체질량 지수는 근육량, 유전적 원인, 다른 개인적 차이를 반영하지 못하는 단점이 있음에도 불구하고 조사자들이나 의료인들이 가장 많이 쓰는 방법 중 하나입니다.</p>
                    <table>
                        <tr>
                            <th>이름</th>
                            <td>${name}</td>
                        </tr>
                        <tr>
                            <th>체중</th>
                            <td>${weight}kg</td>
                        </tr>
                        <tr>
                            <th>키</th>
                            <td>${height}cm</td>
                        </tr>
                        <tr>
                            <th>BMI 지수</th>
                            <td>${bmi.toFixed(2)}</td>
                        </tr>
                    </table>

                    <div class="status-wrap">
                        <h2>BMI 상태</h2>

                        <div class="status-bar">
                            <div class="status-step under">
                                저체중<br>
                                <span>18.5 미만</span>
                            </div>

                            <div class="status-step normal active">
                                정상<br>
                                <span>18.5 이상</span>
                            </div>

                            <div class="status-step over">
                                과체중<br>
                                <span>23.0 이상</span>
                            </div>

                            <div class="status-step obese">
                                비만<br>
                                <span>25.0 이상</span>
                            </div>
                        </div>

                        <p class="status-text">
                            현재 BMI는 <strong>${bmi.toFixed(2)}</strong>입니다.<br>
                            정상은 <strong>18.5 이상</strong>,
                            과체중은 <strong>23.0 이상</strong>,
                            비만은 <strong>25.0 이상</strong>입니다.
                        </p>
                    </div>
                `);
            </script>
            </main>
        </section>
    </main>
</body>
</html>

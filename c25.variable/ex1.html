<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>성적표</title>
        <link rel="stylesheet" href="ex1.css">
    </head>
    <script>
        let username = prompt('당신의 이름을 입력해주세요');
        let scoreKor = Number(prompt('국어 성적을 입력해주세요'));
        let scoreMat = Number(prompt('수학 성적을 입력해주세요'));
        let scoreEng = Number(prompt('영어 성적을 입력해주세요'));
        let scoreSoc = Number(prompt('사회 성적을 입력해주세요'));
        
        let scoreTotal = scoreKor + scoreMat + scoreEng + scoreSoc;
        let scoreAvg = Number((scoreTotal/4).toFixed(2));
        let grade = (scoreAvg>=90)?'1등급':(scoreAvg>=80)?'2등급':(scoreAvg>=70)?'3등급':(scoreAvg>=60)?'4등급':'5등급';
        console.log(grade);

        document.write(`
            <main class="grade-card">
                <table>
                    <caption>${username}님의 성적표</caption>
                    <tbody>
                        <tr>
                            <th scope="row">이름</th>
                            <td>${username}</td>
                        </tr>
                        <tr>
                            <th scope="row">국어</th>
                            <td>${scoreKor}점</td>
                        </tr>
                        <tr>
                            <th scope="row">수학</th>
                            <td>${scoreMat}점</td>
                        </tr>
                        <tr>
                            <th scope="row">영어</th>
                            <td>${scoreEng}점</td>
                        </tr>
                        <tr>
                            <th scope="row">사회</th>
                            <td>${scoreSoc}점</td>
                        </tr>
                        <tr class="summary">
                            <th scope="row">합계</th>
                            <td>${scoreTotal}점</td>
                        </tr>
                        <tr class="summary">
                            <th scope="row">평균</th>
                            <td>${scoreAvg}점</td>
                        </tr>
                        <tr class="summary">
                            <th scope="row">등급</th>
                            <td>${grade}</td>
                        </tr>
                    </tbody>
                </table>
            </main>
        `)
    </script>        
</body>
</html>

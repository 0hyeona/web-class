<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문</title>
</head>
<body>
    <script>
        // for(let i=1; i<11; i++) {
        //     document.write('코드 반복 중'+i+'<br>');
        // }

        for(let i=1; i<10; i++) {
            let num=3;
            let result = num* i;
            document.write(`<p>${num} x ${i} = ${result}</p>`);
        }

        for(let i=2; i<10; i++) {
            document.write(`<h1>${i}단</h1>`)
            for (let j=1; j<10; j++) {
                let result = i*j;
                document.write (`<p>${i} X ${j} = ${result}`)
            }
            document.write('')
        }
        let num = Number(prompt('몇 단을 입력할까요?'));
        for(let i=1; i<10; i++) {
            let result = num* i;
            document.write(`<p>${num} x ${i} = ${result}</p>`);
        }
    </script>
</body>
</html>

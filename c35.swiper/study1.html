<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스와이퍼</title>
    <script src="./js/study1.js" defer></script>
    <link rel="stylesheet" href="./css/study1.css">
    <!-- 1. CDN으로 연결하기 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
</head>

<body>
    <!-- Slider main container -->
    <div class="swiper" id="swip1"> 
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img src="./../c03.image-video/img/rainbow-1600.jpg" alt="무지개 사진"></div>
            <div class="swiper-slide"><img src="./../c03.image-video/img/jeju.jpg" alt="바다 사진"></div>
            <div class="swiper-slide"><img src="./../c03.image-video/img/rainbow-1600.jpg" alt="무지개 사진"></div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
    </div>
    <div class="swiper" id="swip2"> 
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img src="./../c03.image-video/img/jeju.jpg" alt="바다 사진"></div>
            <div class="swiper-slide"><img src="./../c03.image-video/img/rainbow-1600.jpg" alt="무지개 사진"></div>
            <div class="swiper-slide"><img src="./../c03.image-video/img/jeju.jpg" alt="바다 사진"></div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문</title>
</head>
<body>
    <script>
        let age = Number(prompt('나이입력해주세용'))
        if(age>20){
            alert('입장가능합니다.')
        }else{
            alert('입장안됩니다.')
        }

        let score = 83;
        let result = 0;
        if(score>=90){
            result = '1등급';
            console.log(result);
        }else if(score>=80){
            result = '2등급';
            console.log(result);
        }else if(score>=70){
            result = '3등급';
            console.log(result);
        }else{
            result = '4등급';
            console.log(result);
        }
        let total = score>=90?'1등급':score>=80?'2등급':score>=70?'3등급':'4등급';
        console.log(total);

        let fruit = '바나나';
        switch(fruit){
            case '사과':
                alert('사과입니다');
                break;
            
            case '바나나':
                alert('바나나입니다');
                break;

            default:
                alert('없습니다');
        }

        
    </script>
</body>
</html>

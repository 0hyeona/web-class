<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean</title>
</head>
<body>
    <script>
        console.log(!!(20>3));
    </script>
    <h1>있으면 true / 없으면 false</h1>
    <p>false로 간주되는 경우</p>
    <ul>
        <li>숫자 데이터인데 값이 0</li>
        <li>문자데이터인데 내용이 없는 경우</li>
        <li>변수 선언 후 초기화 하지 않은 경우</li>
        <li>undefined</li>
        <li>null</li>
    </ul>
    <script>
        console.log(0);
        console.log('');
        let a;
        console.log(a);
        let b = null;

        -20 // true
        20>10 // 계산식 
        '안녕' // true
        !-30 // false
        !0 // true
        !a // true
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논리 연산자</title>
</head>
<body>
    <h1>&& and 연산자</h1>
    <p>모든 경우가 true일 때 true를 계산, 어느 한 경우라도 false일 경우, false로 계산</p>
    <p>&& 연산자는 거짓인 값을 만나면 그 즉시 평가를 멈추고 해당 값(0)을 그대로 반환합니다.</p>
    <script>
        console.log(10>2 && 5>2) // true
        console.log(5>1 && 5>2 && 5<3) // false
        console.log(10>4 && 0 && 20) // 0
        console.log(0 && 10 && 20 && 30) // 0 
        console.log(10>4 && 0 && 20 + 0 && 10 && 20 && 30) // 0
    </script>
    <h1>|| or 연산자</h1>
    <p>또는이라고 해석됨 </p>
    <p>조건식 중 하나라도 true일 경우 true로 계산</p>
    <script>
        console.log(10<2 || 3!=3 || 4>2) // true
        console.log(0 || !10 || !!20) // true
        console.log(10 || "" || 20) // 10
        console.log((10||0||30)+(0||20||30)) // 30
        console.log(((0||"good"||null)+(!!0||"day".length||40)).length) // 5
    </script>
</body>
</html>

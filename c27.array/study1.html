<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array</title>
</head>
<body>
    <h1>배열 array</h1>
    <p>연관된 데이터들을 모아놓은 집합</p>
    <p>배열은 , 콤마로 구분하여 원소를 여러개 입력할 수 있다.</p>
    <p>배열의 원소는 0부터 시작하는 인덱스 번호를 가진다.</p>

    <script>
        let b = ['유승진', '박진솔', '임은경', '이지하', '김서진']
        console.log(b[0]); // 유승진
        console.log(b[4]); // 김서진
        console.log(b[1].length); // 3
        console.log(b[2][1] + b[3][2]); // 은하
        console.log((!b[3] || !b[4] || b[1])[0]); // 박

        b.pop();
        console.log(b);
        b.pop();
        b.push('김현아');
        console.log(b);
    </script>
</body>
</html>
